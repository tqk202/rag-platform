# CI：push / PR 时自动跑测试 + 静态检查。
# 测试是独立库（SQLite + Milvus Lite 本地文件），无需外部服务，Ubuntu runner 直接能跑。
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: 测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: 跑测试
        run: |
          cd backend
          python -m pytest -q

  lint:
    name: 静态检查 (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        run: pip install ruff
      - name: 检查
        run: ruff check backend/app backend/scripts backend/tests backend/alembic

  eval:
    name: 评测护栏 (golden eval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: 跑黄金评测 + 质量回退检查
        run: |
          cd backend
          python scripts/check_eval_ci.py

  migrations:
    name: 数据库迁移 (alembic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: 空库跑迁移 + 校验 schema 完整
        run: |
          cd backend
          mkdir -p data
          export DATABASE_URL="sqlite+aiosqlite:///./data/ci_alembic.db"
          python -m alembic upgrade head
          python - <<'EOF'
          import sqlite3
          con = sqlite3.connect("data/ci_alembic.db")
          rows = {r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected = {"users", "documents", "chunks", "chat_sessions", "chat_messages",
                      "audit_logs", "knowledge_bases", "answer_feedback", "query_traces",
                      "chunks_fts", "alembic_version"}
          missing = expected - rows
          assert not missing, f"迁移后缺表: {missing}"
          print("迁移后全部预期表存在 OK")
          EOF
      - name: 模型与迁移同步检查
        run: |
          cd backend
          export DATABASE_URL="sqlite+aiosqlite:///./data/ci_alembic.db"
          python -m alembic check
