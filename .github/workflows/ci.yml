# CI：push / PR 时自动跑测试 + 静态检查。
# 测试是独立库（SQLite + Milvus Lite 本地文件），无需外部服务，Ubuntu runner 直接能跑。
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: 测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: 跑测试
        run: |
          cd backend
          python -m pytest -q

  lint:
    name: 静态检查 (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        run: pip install ruff
      - name: 检查
        run: ruff check backend/app backend/scripts backend/tests

  eval:
    name: 评测护栏 (golden eval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: 跑黄金评测 + 质量回退检查
        run: |
          cd backend
          python scripts/check_eval_ci.py
