name: rag-platform

services:
  # ---------- 元数据库：用户/文档/权限/版本 ----------
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Redis：异步任务队列（文档处理） ----------
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Milvus 向量库（etcd 注册中心 + MinIO 存储） ----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: rag-etcd
    restart: unless-stopped
    # 必须监听 0.0.0.0:2379 并通告 etcd:2379，否则只绑 localhost，milvus 连不上
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: rag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    deploy:
      resources:
        limits:
          memory: 2G
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------- 后端 API ----------
  backend:
    build: ./backend
    container_name: rag-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    # 模型 key 等真实配置放 backend/.env（gitignored，不进镜像），运行时注入
    env_file:
      - .env
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      VECTOR_URI: http://milvus:19530
      # 生产强制开关：覆盖开发 .env 里的 inline/mock 等
      ENVIRONMENT: production
      DEBUG: "false"
      INGESTION_MODE: async
      EMBEDDING_BACKEND: api
      RERANKER_BACKEND: api
      LLM_BACKEND: api
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
    # 启动前先应用 Alembic 迁移（schema 版本化，老库原地升级不丢数据）
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  # ---------- 异步文档处理 Worker ----------
  worker:
    build: ./backend
    container_name: rag-worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    env_file:
      - .env
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      VECTOR_URI: http://milvus:19530
      ENVIRONMENT: production
      DEBUG: "false"
      INGESTION_MODE: async
      EMBEDDING_BACKEND: api
      RERANKER_BACKEND: api
      LLM_BACKEND: api
    volumes:
      - uploads_data:/app/data/uploads
    command: celery -A app.tasks.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- 前端 ----------
  frontend:
    build: ./frontend
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg_data:
  etcd_data:
  minio_data:
  milvus_data:
  uploads_data:
